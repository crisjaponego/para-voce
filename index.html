<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Saudade detectada</title>
<style>
:root{--bg1:#14182b;--bg2:#3a1c4a;--bg3:#e0645c;--text:#fff;--muted:rgba(255,255,255,.68);--glass:rgba(255,255,255,.16);--glass-line:rgba(255,255,255,.22);--blue:#0a84ff;--red:#ff453a;--green:#32d74b;box-sizing:border-box}
html{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;color:var(--text);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 130%)}
.screen{position:absolute;inset:0;padding:env(safe-area-inset-top,0px) 22px env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s}
.screen.on{opacity:1;pointer-events:auto}
#lock{align-items:center}
.lock-top{margin-top:11vh;text-align:center}
.date{font-size:18px;font-weight:500;color:var(--muted)}
.clock{font-size:clamp(76px,24vw,104px);font-weight:600;letter-spacing:-2px;line-height:1.05}
.notif{margin-top:auto;margin-bottom:12vh;width:100%;max-width:420px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:22px;padding:14px 16px;display:flex;gap:12px;text-align:left;cursor:pointer;font:inherit;color:inherit;animation:drop .7s cubic-bezier(.2,1.3,.4,1) 1.1s both}
.notif .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:20px}
.notif b{display:block;font-size:15px}
.notif span{font-size:14px;color:var(--muted);line-height:1.35}
.notif small{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);left:0;right:0;text-align:center;color:var(--muted);font-size:13px;opacity:0;animation:fade .6s 2.2s forwards}
@keyframes drop{from{transform:translateY(-130px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{to{opacity:1}}
.notif.buzz{animation:drop .7s cubic-bezier(.2,1.3,.4,1) 1.1s both,buzz 1.6s 2.4s infinite}
@keyframes buzz{0%,86%,100%{transform:none}88%{transform:translateX(-5px)}92%{transform:translateX(5px)}96%{transform:translateX(-3px)}}
#alert,#scan,#result,#done{justify-content:center;align-items:center}
.dialog{width:100%;max-width:340px;background:rgba(44,44,52,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:20px;overflow:hidden;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#alert.on .dialog{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.dialog .body{padding:22px 20px 18px}
.warn{font-size:34px;margin-bottom:6px}
.dialog h1{font-size:18px;margin:0 0 8px;font-weight:600}
.dialog p{margin:0;font-size:14.5px;line-height:1.45;color:var(--muted)}
.meter{margin:16px 0 4px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f0a,var(--red));border-radius:8px;transition:width 1.6s cubic-bezier(.3,.8,.3,1)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
